<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workshop">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Workshop Feed</title>
<style>
:root { color-scheme: light dark;
  --page:#FAFAFA; --surface:#FFFFFF; --ink:#000; --muted:rgba(60,60,67,.6);
  --fill:rgba(120,120,128,.12); --blue:#007AFF; --red:#FF3B30; }
@media (prefers-color-scheme: dark){ :root{
  --page:#000; --surface:#1C1C1E; --ink:#fff; --muted:rgba(235,235,245,.55);
  --fill:rgba(120,120,128,.22); --blue:#0A84FF; --red:#FF453A; } }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0; min-height:100svh; display:flex; align-items:center; justify-content:center;
  background:var(--page); color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding:24px}
.card{width:100%; max-width:340px; text-align:center}
.lock{width:74px; height:74px; margin:0 auto 18px; border-radius:20px;
  background:linear-gradient(180deg,#3395ff,#007AFF); display:flex; align-items:center;
  justify-content:center; font-size:34px; box-shadow:0 10px 30px rgba(0,122,255,.35)}
h1{font-size:22px; font-weight:700; letter-spacing:-0.4px; margin:0 0 4px}
.sub{font-size:14px; color:var(--muted); margin:0 0 22px}
#pw{width:100%; min-height:50px; padding:12px 16px; border:none; border-radius:13px;
  background:var(--fill); color:var(--ink); font-size:17px; text-align:center;
  font-family:inherit; outline:none; letter-spacing:2px}
#pw.err{animation:shake .35s; border:1.5px solid var(--red)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#msg{min-height:20px; font-size:13px; color:var(--red); margin:8px 0 2px}
#go{width:100%; min-height:50px; margin-top:6px; border:none; border-radius:999px;
  background:var(--blue); color:#fff; font-size:17px; font-weight:600; cursor:pointer; font-family:inherit}
#go:disabled{opacity:.5}
label{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:16px;
  font-size:14px; color:var(--muted); cursor:pointer; user-select:none}
input[type=checkbox]{width:18px; height:18px; accent-color:var(--blue)}
.foot{margin-top:26px; font-size:11.5px; color:var(--muted)}
#spin{display:none; margin-top:10px; font-size:13px; color:var(--muted)}
</style>
</head>

  </form>

const KEYNAME = 'wf_devicekey_v1';
const b2a = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

async function deriveKey(pass){
  const mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b2a(DATA.salt), iterations:DATA.iter, hash:'SHA-256' },
    mat, { name:'AES-GCM', length:256 }, true, ['decrypt']);
}
async function decryptWith(key){
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b2a(DATA.iv) }, key, b2a(DATA.ct));
  return new TextDecoder().decode(pt);
}
function show(html){
  document.open(); document.write(html); document.close();
}
async function tryRemembered(){
  const raw = localStorage.getItem(KEYNAME);
  if (!raw) return false;
  try {
    const key = await crypto.subtle.importKey('raw', b2a(raw), { name:'AES-GCM' }, false, ['decrypt']);
    show(await decryptWith(key));
    return true;
  } catch(e) { localStorage.removeItem(KEYNAME); return false; }
}
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const pw = document.getElementById('pw');
  const go = document.getElementById('go');
  document.getElementById('msg').textContent = '';
  go.disabled = true; document.getElementById('spin').style.display = 'block';
  try {
    const key = await deriveKey(pw.value);
    const html = await decryptWith(key);
    if (document.getElementById('rem').checked) {
      try {
        const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
        localStorage.setItem(KEYNAME, btoa(String.fromCharCode(...raw)));
      } catch(e) {}
    }
    show(html);
  } catch(e) {
    go.disabled = false; document.getElementById('spin').style.display = 'none';
    document.getElementById('msg').textContent = 'Wrong passcode — try again';
    pw.classList.add('err'); pw.select();
    setTimeout(() => pw.classList.remove('err'), 400);
  }
});
tryRemembered();
</script>
